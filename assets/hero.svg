<svg width="940" height="280" viewBox="0 0 940 280" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16121F"/>
      <stop offset="100%" stop-color="#1E1630"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0B341"/>
      <stop offset="100%" stop-color="#8a6a1c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F1EDFB"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="938" height="278" rx="18" fill="url(#bg)" stroke="#2E2640" stroke-width="1.5"/>
  <rect x="48" y="0" width="220" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- ambient marks -->
  <g fill="#2E2640" font-size="12">
    <text x="560" y="40">+</text><text x="880" y="250">+</text><text x="40" y="252">+</text>
    <circle cx="596" cy="226" r="2"/><circle cx="906" cy="60" r="2"/>
  </g>

  <!-- left: identity -->
  <text x="48" y="64" fill="#8B85A0" font-size="11" letter-spacing="4">DATA ANALYST PORTFOLIO — 2026</text>
  <text x="48" y="112" fill="url(#name)" font-size="40" font-weight="800" letter-spacing="0.5">Sumit Prajapat</text>
  <text x="48" y="142" fill="#A78BFA" font-size="15.5">Data Analyst · BI Developer · Power BI Certified (PL-300)</text>

  <text x="48" y="176" fill="#8B85A0" font-size="13">SQL  ·  Power BI &amp; DAX  ·  Python  ·  Azure ETL  ·  Machine Learning</text>

  <!-- open-to-work pill -->
  <rect x="48" y="198" width="262" height="34" rx="17" fill="#1B1430" stroke="#3A2F55"/>
  <circle cx="70" cy="215" r="4.5" fill="#34D399">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="220" fill="#C8C2DC" font-size="12.5">Open to Data Analyst &amp; BI roles</text>

  <!-- quiet metrics under pill -->
  <text x="340" y="220" fill="#8B85A0" font-size="12">558K+ claims analyzed   ·   9M+ rows processed</text>

  <!-- right: mini dashboard card -->
  <g>
    <rect x="630" y="38" width="266" height="204" rx="13" fill="#1B1430" stroke="#2E2640"/>
    <circle cx="650" cy="58" r="3" fill="#2E2640"/><circle cx="662" cy="58" r="3" fill="#2E2640"/><circle cx="674" cy="58" r="3" fill="#2E2640"/>
    <text x="690" y="62" fill="#8B85A0" font-size="10.5" font-family="Consolas, monospace">performance.pbix</text>

    <!-- KPI chips -->
    <rect x="648" y="76" width="110" height="26" rx="6" fill="#221A3A"/>
    <text x="657" y="93" fill="#C4B5FD" font-size="11" font-weight="700">↑ 226× finding</text>
    <rect x="766" y="76" width="112" height="26" rx="6" fill="#221A3A"/>
    <text x="775" y="93" fill="#C4B5FD" font-size="11" font-weight="700">90.1% recall</text>

    <!-- animated bars -->
    <g fill="url(#violet)">
      <rect x="652" y="186" width="22" height="0" rx="3">
        <animate attributeName="height" from="0" to="38" dur="0.7s" begin="0.2s" fill="freeze"/>
        <animate attributeName="y" from="186" to="148" dur="0.7s" begin="0.2s" fill="freeze"/>
      </rect>
      <rect x="684" y="186" width="22" height="0" rx="3">
        <animate attributeName="height" from="0" to="56" dur="0.7s" begin="0.35s" fill="freeze"/>
        <animate attributeName="y" from="186" to="130" dur="0.7s" begin="0.35s" fill="freeze"/>
      </rect>
      <rect x="716" y="186" width="22" height="0" rx="3">
        <animate attributeName="height" from="0" to="46" dur="0.7s" begin="0.5s" fill="freeze"/>
        <animate attributeName="y" from="186" to="140" dur="0.7s" begin="0.5s" fill="freeze"/>
      </rect>
      <rect x="748" y="186" width="22" height="0" rx="3">
        <animate attributeName="height" from="0" to="70" dur="0.7s" begin="0.65s" fill="freeze"/>
        <animate attributeName="y" from="186" to="116" dur="0.7s" begin="0.65s" fill="freeze"/>
      </rect>
      <rect x="780" y="186" width="22" height="0" rx="3">
        <animate attributeName="height" from="0" to="58" dur="0.7s" begin="0.8s" fill="freeze"/>
        <animate attributeName="y" from="186" to="128" dur="0.7s" begin="0.8s" fill="freeze"/>
      </rect>
      <rect x="812" y="186" width="22" height="0" rx="3">
        <animate attributeName="height" from="0" to="82" dur="0.7s" begin="0.95s" fill="freeze"/>
        <animate attributeName="y" from="186" to="104" dur="0.7s" begin="0.95s" fill="freeze"/>
      </rect>
      <rect x="844" y="186" width="22" height="0" rx="3" opacity="0.55">
        <animate attributeName="height" from="0" to="64" dur="0.7s" begin="1.1s" fill="freeze"/>
        <animate attributeName="y" from="186" to="122" dur="0.7s" begin="1.1s" fill="freeze"/>
      </rect>
    </g>
    <line x1="648" y1="187" x2="878" y2="187" stroke="#2E2640" stroke-width="1"/>

    <!-- gold sparkline drawing itself -->
    <path d="M650 222 L688 214 L718 218 L752 206 L786 210 L822 198 L876 202" fill="none"
          stroke="#E0B341" stroke-width="2" stroke-linecap="round" pathLength="1"
          stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.8s" begin="0.6s" fill="freeze"/>
    </path>
  </g>
</svg>
