<svg width="940" height="190" viewBox="0 0 940 190" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16121F"/><stop offset="100%" stop-color="#1B1430"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="938" height="188" rx="16" fill="url(#pbg)" stroke="#2E2640" stroke-width="1.5"/>

  <!-- flow line with marching dashes -->
  <path d="M120 95 H820" stroke="#2E2640" stroke-width="2"/>
  <path d="M120 95 H820" stroke="#7C3AED" stroke-width="2" stroke-dasharray="10 14" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- nodes -->
  <g text-anchor="middle">
    <!-- 1 raw -->
    <rect x="40" y="62" width="120" height="66" rx="11" fill="#1B1430" stroke="#3A2F55" stroke-width="1.5"/>
    <text x="100" y="90" fill="#E9E4F5" font-size="13" font-weight="700">Raw Data</text>
    <text x="100" y="108" fill="#8B85A0" font-size="10">Kaggle · AMFI · Yahoo</text>

    <!-- 2 blob -->
    <rect x="208" y="62" width="120" height="66" rx="11" fill="#1B1430" stroke="#3A2F55" stroke-width="1.5"/>
    <text x="268" y="90" fill="#E9E4F5" font-size="13" font-weight="700">Azure Blob</text>
    <text x="268" y="108" fill="#8B85A0" font-size="10">raw landing zone</text>

    <!-- 3 adf -->
    <rect x="376" y="62" width="120" height="66" rx="11" fill="#1B1430" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="436" y="90" fill="#E9E4F5" font-size="13" font-weight="700">Data Factory</text>
    <text x="436" y="108" fill="#A78BFA" font-size="10">orchestrated ETL</text>

    <!-- 4 postgres (gold key node) -->
    <rect x="544" y="62" width="130" height="66" rx="11" fill="#1B1430" stroke="#E0B341" stroke-width="1.5"/>
    <text x="609" y="90" fill="#E9E4F5" font-size="13" font-weight="700">PostgreSQL</text>
    <text x="609" y="108" fill="#E0B341" font-size="10">star schema ★</text>

    <!-- 5 outputs stacked -->
    <rect x="722" y="32" width="124" height="52" rx="11" fill="#1B1430" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="784" y="54" fill="#E9E4F5" font-size="12.5" font-weight="700">Power BI</text>
    <text x="784" y="70" fill="#A78BFA" font-size="9.5">65+ DAX · AI visuals</text>

    <rect x="722" y="106" width="124" height="52" rx="11" fill="#1B1430" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="784" y="128" fill="#E9E4F5" font-size="12.5" font-weight="700">Python ML</text>
    <text x="784" y="144" fill="#A78BFA" font-size="9.5">sklearn · Prophet · apps</text>
  </g>

  <!-- branch connectors -->
  <path d="M674 95 C700 95 700 58 722 58" stroke="#2E2640" stroke-width="2" fill="none"/>
  <path d="M674 95 C700 95 700 132 722 132" stroke="#2E2640" stroke-width="2" fill="none"/>

  <!-- destination pulse -->
  <circle cx="884" cy="95" r="6" fill="#34D399">
    <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="884" y="122" fill="#8B85A0" font-size="9.5" text-anchor="middle">decisions</text>

  <text x="24" y="26" fill="#8B85A0" font-size="10.5" letter-spacing="3">HOW I SHIP ANALYTICS — END TO END</text>
</svg>
