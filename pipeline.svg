<svg viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; }
    .title { font-size: 12px; fill: #8B949E; }
    .name  { font-size: 36px; font-weight: 700; fill: #E0B341; letter-spacing: 3px; }
    .sub   { font-size: 15px; fill: #3FB950; letter-spacing: 1px; }
    .p { fill: #3FB950; }   /* prompt */
    .k { fill: #FF7B72; }   /* SQL keyword */
    .i { fill: #E6EDF3; }   /* identifier */
    .s { fill: #A5D6FF; }   /* string */
    .c { fill: #8B949E; }   /* comment / result */
    .a { fill: #E0B341; }   /* accent */
    .line { opacity: 0; animation: fadein 0.45s ease forwards; }
    .d1 { animation-delay: 0.3s; } .d2 { animation-delay: 0.9s; }
    .d3 { animation-delay: 1.5s; } .d4 { animation-delay: 2.1s; }
    .d5 { animation-delay: 2.7s; } .d6 { animation-delay: 3.3s; }
    .cursor { opacity: 0; animation: blink 1.1s steps(1) infinite; animation-delay: 3.9s; }
    @keyframes fadein { to { opacity: 1; } }
    @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <!-- terminal window -->
  <rect x="12" y="8" width="976" height="304" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <!-- title bar -->
  <path d="M12 20 A12 12 0 0 1 24 8 H976 A12 12 0 0 1 988 20 V44 H12 Z" fill="#161B22"/>
  <circle cx="38" cy="26" r="6" fill="#FF5F56"/>
  <circle cx="60" cy="26" r="6" fill="#FFBD2E"/>
  <circle cx="82" cy="26" r="6" fill="#27C93F"/>
  <text x="500" y="31" text-anchor="middle" class="title">recruiter@hiring — psql — connected to sumit_prajapat</text>

  <!-- name block -->
  <text x="52" y="98" class="name line d1">SUMIT PRAJAPAT</text>
  <text x="52" y="126" class="sub line d2">Data Analyst · BI Developer · PL-300 Certified</text>

  <!-- session -->
  <text x="52" y="170" class="line d3">
    <tspan class="p">sumit_prajapat=#</tspan>
    <tspan class="k"> SELECT</tspan><tspan class="i"> pipeline</tspan>
    <tspan class="k"> FROM</tspan><tspan class="i"> how_i_work</tspan><tspan class="i">;</tspan>
  </text>
  <text x="52" y="198" class="line d4">
    <tspan class="c">  ingestion → Azure pipelines → SQL star schemas → Power BI → ML models</tspan>
  </text>
  <text x="52" y="234" class="line d5">
    <tspan class="p">sumit_prajapat=#</tspan>
    <tspan class="k"> SELECT</tspan><tspan class="i"> philosophy</tspan>
    <tspan class="k"> FROM</tspan><tspan class="i"> dashboards</tspan><tspan class="i">;</tspan>
  </text>
  <text x="52" y="262" class="line d6">
    <tspan class="s">  "one quantified headline — not a wall of charts"</tspan>
  </text>
  <text x="52" y="294" class="line d6"><tspan class="p">sumit_prajapat=#</tspan></text>
  <rect x="212" y="281" width="10" height="17" fill="#3FB950" class="cursor"/>
</svg>
